# AGNI configuration file
title = "Pure-steam runaway OLR"

[planet]
    tmp_surf        = 540.0
    instellation    = 4000.0
    albedo_b        = 0.0
    s0_fact         = 0.6652
    zenith_angle    = 60.0
    surface_material= "greybody"
    albedo_s        = 0.0
    radius          = 6.37e6
    gravity         = 9.81
    flux_int        = 0.0
    roughness       = 1.0e-2
    wind_speed      = 10.0

[files]
    # input_sf        = "res/spectral_files/Oak/318/Oak.sf"
    # input_star      = "res/stellar_spectra/sun.txt"
    input_sf = "nogit_runtime.sf"
    input_star = ""
    output_dir      = "out/"

[composition]
    p_surf          = 53.0
    p_top           = 1e-5
    vmr_dict        = { H2O = 1.0}
    condensates     = []

[execution]
    clean_output    = true
    verbosity       = 2
    max_steps       = 200
    max_runtime     = 400
    num_levels      = 80
    solution_type   = 3
    solver          = ""
    dx_max          = 400.0
    initial_state   = ["dry","sat","H2O","str","2"]
    linesearch      = 0
    easy_start      = false
    grey_start      = false
    converge_atol   = 1.0e-1
    converge_rtol   = 1.0e-4
    perturb_all     = false
    benchmark_rt    = true

[physics]
    chemistry       = false
    continua        = true
    rayleigh        = false
    cloud           = false
    overlap_method  = "ee"
    real_gas        = false
    thermo_funct    = true
    sensible_heat   = false
    conduction      = false
    latent_heat     = false
    convection      = false
    convection_crit = "s"
    rainout         = false
    oceans          = false
    grey_lw         = 5e-3
    grey_sw         = 2e-3

[plots]
    at_runtime      = true
    temperature     = true
    fluxes          = true
    optical_depth   = true
    contribution    = true
    emission        = true
    albedo          = true
    mixing_ratios   = true
    animate         = false
    height          = true
    cloud           = true
